<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="94" height="94" rx="25" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <text x="50" y="66" font-size="52" text-anchor="middle" font-family="'Segoe UI Emoji', AppleColorEmoji, sans-serif" filter="url(#shadow)">📚</text>
</svg>
